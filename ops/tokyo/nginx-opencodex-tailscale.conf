map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name opencodex-tokyo.tail0dc240.ts.net;

    # The dashboard and API are reachable only through this node's Tailscale IP.
    allow 100.64.0.0/10;
    deny all;

    ssl_certificate /etc/ssl/tailscale/opencodex-tokyo.tail0dc240.ts.net.crt;
    ssl_certificate_key /etc/ssl/tailscale/opencodex-tokyo.tail0dc240.ts.net.key;

    client_max_body_size 256m;
    client_body_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css text/plain;

    # Proxy hashed assets through the active app. Release directories live below
    # /home/ubuntu, which is intentionally not traversable by Nginx's www-data user.
    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:10100;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:10100;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 1h;
        add_header Cache-Control "private, max-age=3600" always;
        access_log off;
    }

    # The management plane uses OpenCodex's existing admin credential internally.
    # Browsers never receive this secret; they only need to be inside the tailnet.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:10100;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:10100;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include /etc/nginx/snippets/opencodex-admin-header.conf;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Keep the Codex/Claude data plane streaming and independent from dashboard auth.
    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:10100;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:10100;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Root HTML, health checks, favicon, and SPA navigation.
    location / {
        proxy_pass http://127.0.0.1:10100;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:10100;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
